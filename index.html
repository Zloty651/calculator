<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | Zloty651</title>
  <link rel="stylesheet" href="style.css">
  <!-- NOWE: Podpięcie pliku manifestu dla aplikacji offline -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="calculator">

    <div class="display">0</div>

    <div class="buttons">
      <button class="btn function" id="clear">AC</button>
      <button class="btn function" id="del">DEL</button>
      <button class="btn operator">%</button>
      <button class="btn operator">/</button>

      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator">*</button>

      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn operator">-</button>

      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn operator">+</button>

      <button class="btn number zero">0</button>
      <button class="btn decimal">.</button>
      <button class="btn equal">=</button>
    </div> <!-- POPRAWIONE: Domknięcie sekcji przycisków -->
  </div> <!-- POPRAWIONE: Domknięcie całego kalkulatora -->

  <!-- Podpięcie głównego skryptu logicznego kalkulatora -->
  <script src="script.js"></script>

  <!-- NOWE: Rejestracja Service Workera, aby kalkulator działał bez Wi-Fi -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Tryb offline gotowy!', reg))
          .catch(err => console.log('Błąd trybu offline', err));
      });
    }
  </script>
</body>
</html>
