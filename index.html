<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | Zloty651</title>
  <link rel="stylesheet" href="dark.css">
  <link rel="manifest" href="manifest.json">
</head>
<!-- WYMUSZENIE CIEMNEGO MOTYWU BEZPOŚREDNIO W HTML -->
<body style="background-color: #070c14 !important; background: radial-gradient(circle at 15% 75%, rgba(255, 40, 180, 0.15), transparent 25%), radial-gradient(circle at 90% 35%, rgba(0, 220, 255, 0.15), transparent 25%), radial-gradient(circle at 70% 100%, rgba(130, 30, 255, 0.12), transparent 25%) !important; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 25px; font-family: 'Inter', Arial, sans-serif; overflow-x: hidden;">

  <div class="calculator">

    <div class="display">0</div>

    <div class="buttons">
      <button class="btn function" id="clear">AC</button>
      <button class="btn function" id="del">DEL</button>
      <button class="btn operator">%</button>
      <button class="btn operator">/</button>

      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator">*</button>

      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn operator">-</button>

      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn operator">+</button>

      <button class="btn number zero">0</button>
      <button class="btn decimal">.</button>
      <button class="btn equal">=</button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Tryb offline gotowy!', reg))
          .catch(err => console.log('Błąd trybu offline', err));
      });
    }
  </script>
</body>
</html>
